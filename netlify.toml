[build]
  # P0-002: the repository root is no longer the publish directory.
  # tools/build-public.sh copies only allowlisted files into _public.
  command = "bash tools/build-public.sh"
  publish = "_public"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# ── Security Headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — page may not be embedded in iframes on other origins
    X-Frame-Options = "SAMEORIGIN"
    # Prevent MIME-type sniffing
    X-Content-Type-Options = "nosniff"
    # Limit referrer data sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Disable unused browser features
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=()"

# ── Asset Cache ───────────────────────────────────────────────────────────────
[[headers]]
  for = "/assets/*"
  [headers.values]
    # F-03 (Fable audit 001): assets under /assets/* are NOT content-hashed
    # (e.g. /assets/markt.js, /assets/lead-capture.js are referenced by stable name).
    # A one-year immutable cache would strand mutable JS in returning browsers and
    # would block any future rotation of the lead-transport configuration.
    # Bounded daily cache with mandatory revalidation instead.
    # P0-T2 hotfix (2026-08-13): max-age was 86400. `must-revalidate` only forces
    # revalidation once an entry is STALE, so inside those 24h a browser never
    # asked — and kept running the pre-T2 lead-capture.js, which still posted
    # straight to Make. max-age=0 makes every subsequent use revalidate; a 304
    # keeps it cheap. Stable filenames must never get a long fresh window.
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Netlify Function endpoints — no cache ────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
