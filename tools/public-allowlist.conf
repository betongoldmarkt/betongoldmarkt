# P0 PUBLIC ALLOWLIST — BETON GOLD MARKT
# Sourced by tools/build-public.sh. Bash array syntax.

# (1) File extensions that MAY be published. Anything not listed here is
#     excluded by construction: .md .docx .patch .sh .yml .toml etc.
ALLOW_EXT=(
  html css js json xml txt webmanifest pdf
  jpg jpeg png webp gif svg ico avif
  woff woff2 ttf eot
  mp4 webm
)

# (2) Exact filenames that MAY be published even though they carry no extension.
ALLOW_FILENAME=(
  _headers
  _redirects
)

# (3) Paths that are EXCLUDED even though their extension is allowed.
DENY_PATH=(
  # repository / tooling metadata
  .git
  .gitignore
  .github
  node_modules
  tools
  # Netlify Functions must stay OUTSIDE the publish directory
  netlify
  # internal reports
  05_REPORTS
  # developer patch artefact served as a public page at the deployed commit
  ANGEBOTE-PATCH.html
  # R-2 (task 022, Founder-approved): internal hero design variants. Source files are
  # PRESERVED in the repository; they are reference artefacts only and must never be
  # emitted into _public, where they would be publicly reachable and indexable.
  hero-b.html
  hero-c.html
  # Decap CMS surface. Section 3 ruling: exclude unless actively required AND
  # securely configured. Neither could be verified read-only, so the default
  # applies. SOURCE FILES ARE PRESERVED. To re-enable, delete this one line
  # after confirming Netlify Identity / Git Gateway auth is active.
  admin
  # 075X R2: an internal `git status` snapshot is committed at the repo root.
  # .txt is an allowed extension, so without this line it ships as a public
  # /status.txt. The source file stays in the repository; it must simply never
  # enter the publish directory.
  status.txt
  # P0-C2.1 (Founder-approved): the Netlify Blobs dependency contract.
  # Netlify installs from these BEFORE running the build command, and the
  # Functions bundler resolves @netlify/blobs through them, so both files must
  # stay in the repository. But .json is an allowed extension, so without these
  # two lines they ship as public /package.json and /package-lock.json on the
  # investor-facing domain, exposing the full dependency tree. SOURCE FILES ARE
  # PRESERVED; they are simply never copied into the publish directory.
  package.json
  package-lock.json
)
